<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Managerspiel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e6e9ee'/%3E%3Cpath d='M16 8l6 4.4-2.3 7H12.3l-2.3-7z' fill='%2314171c'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body class="manager">
    <!-- Ohne Konto: anmelden -->
    <main id="anmeldung" class="mitte schmal" hidden>
      <h1>Managerspiel</h1>
      <p class="unterzeile">Zwei Ligen, ein Pokal, Saison um Saison. Der Spielstand liegt an deinem Konto.</p>
      <form id="formAnmelden" class="formular">
        <label class="feld">
          <span>Mailadresse</span>
          <input type="email" id="anEmail" autocomplete="email" required />
        </label>
        <label class="feld">
          <span>Kennwort</span>
          <input type="password" id="anKennwort" autocomplete="current-password" required />
        </label>
        <button type="submit" id="anmeldenKnopf" class="haupt">Anmelden</button>
      </form>
      <p id="anmeldeMeldung" class="schlecht" hidden></p>
      <p class="unterzeile">Noch kein Konto? Registriert wird mit Einladungscode auf der <a href="/">Startseite</a>.</p>
    </main>

    <!-- Angemeldet: Spielstaende und neue Karriere -->
    <main id="start" class="mitte" hidden>
      <div class="kopfreihe">
        <div>
          <h1>Managerspiel</h1>
          <p class="unterzeile">Angemeldet als <strong id="werName"></strong>
            <button id="abmelden" class="leise klein">abmelden</button></p>
        </div>
      </div>

      <section>
        <h2>Deine Spielstaende</h2>
        <div id="spielstaende" class="spielstaende"></div>
      </section>

      <section>
        <h2>Neue Karriere</h2>
        <div class="reihe">
          <label class="feld">
            <span>Name</span>
            <input id="neuName" maxlength="40" value="Meine Karriere" autocomplete="off" />
          </label>
          <label class="feld klein">
            <span>Startwert</span>
            <input id="startwert" value="4711" inputmode="numeric" autocomplete="off" />
          </label>
          <button id="vereineLaden">Vereine zeigen</button>
        </div>
        <p id="neuHinweis" class="unterzeile"></p>
        <div id="vereinswahl" class="zweispalten"></div>
      </section>
    </main>

    <!-- Die Karriere -->
    <div id="spiel" hidden>
      <header class="kopf">
        <div class="kopfreihe">
          <div>
            <h1 id="vereinName">—</h1>
            <p class="unterzeile" id="kopfLage"></p>
          </div>
          <div class="kopfzahlen">
            <div><span id="kopfPlatz">–</span><small>Platz</small></div>
            <div><span id="kopfKonto">0</span><small>Konto</small></div>
            <div><span id="kopfVertrauen">–</span><small>Vertrauen</small></div>
          </div>
        </div>
        <div class="anpfiff">
          <button id="weiter" class="haupt gross">Weiter</button>
          <button id="vorWinter">bis zur Winterpause</button>
          <button id="vorEnde">bis vor das Saisonende</button>
          <label class="feld klein tempo">
            <span>Ticker</span>
            <select id="tempo">
              <option value="0">sofort</option>
              <option value="2600" selected>schnell</option>
              <option value="7000">gemuetlich</option>
            </select>
          </label>
          <span id="lauf" class="unterzeile"></span>
          <button id="zurStart" class="leise">Spielstaende</button>
        </div>
        <nav class="reiter" id="reiter">
          <button class="reiterKnopf" data-blatt="buero" aria-pressed="true">Buero</button>
          <button class="reiterKnopf" data-blatt="mannschaft" aria-pressed="false">Mannschaft</button>
          <button class="reiterKnopf" data-blatt="kader" aria-pressed="false">Kader</button>
          <button class="reiterKnopf" data-blatt="spieltag" aria-pressed="false">Spieltag</button>
          <button class="reiterKnopf" data-blatt="liga" aria-pressed="false">Liga</button>
          <button class="reiterKnopf" data-blatt="pokal" aria-pressed="false">Pokal</button>
          <button class="reiterKnopf" data-blatt="transfer" aria-pressed="false">Transfer</button>
          <button class="reiterKnopf" data-blatt="finanzen" aria-pressed="false">Finanzen</button>
        </nav>
      </header>

      <main id="inhalt"></main>
    </div>

    <div id="dialog" class="ueberlagerung" hidden>
      <div class="dialog" role="dialog" aria-modal="true">
        <button id="dialogZu" class="leise zu" aria-label="Schliessen">×</button>
        <div class="dialog-inhalt"></div>
      </div>
    </div>

    <div id="meldung" class="meldung" hidden></div>
    <script src="manager.js"></script>
  </body>
</html>
