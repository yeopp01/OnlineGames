<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnlineGames</title>
    <link rel="stylesheet" href="stil.css" />
  </head>
  <body>
    <main id="vorraum" class="tafel">
      <h1>OnlineGames</h1>
      <p class="unterzeile">Ein Raumcode, kein Konto.</p>

      <label class="feld">
        <span>Dein Name</span>
        <input id="name" maxlength="20" autocomplete="off" placeholder="Daniel" />
      </label>

      <div class="reihe">
        <button id="erstellen" class="haupt">Partie eroeffnen</button>
      </div>

      <p class="trenner">oder</p>

      <div class="reihe">
        <input id="code" maxlength="7" autocomplete="off" placeholder="ABC-DEF" class="code" />
        <button id="beitreten">Beitreten</button>
      </div>

      <p id="meldung" class="meldung" hidden></p>
    </main>

    <main id="warteraum" class="tafel" hidden>
      <h1>Raum <span id="raumcode" class="code-gross"></span></h1>
      <p class="unterzeile">Diesen Code an die Mitspieler weitergeben.</p>
      <ul id="spielerliste" class="spieler"></ul>
      <div class="reihe">
        <button id="starten" class="haupt">Partie starten</button>
      </div>
      <p id="wartemeldung" class="meldung" hidden></p>
    </main>

    <div id="spiel" hidden>
      <canvas id="brett"></canvas>
      <div id="kopfzeile" class="kopfzeile">
        <span id="vorraete"></span>
        <span id="hinweis" class="hinweis">Ziehen waehlt aus · Rechtsklick befiehlt · WASD schiebt die Karte</span>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
