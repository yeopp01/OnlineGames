<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fading Allies: ein gespaltener Schild - die eine Haelfte steht in Gold,
       die des Verbuendeten verblasst und broeckelt weg. Selbst gezeichnet. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc8f"/>
      <stop offset="1" stop-color="#c4832a"/>
    </linearGradient>
    <linearGradient id="fahl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bccddb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bccddb" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="schild">
      <path d="M12 10H52V31C52 43 44 51 32 57C20 51 12 43 12 31Z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1b2630"/>
  <g clip-path="url(#schild)">
    <rect x="12" y="10" width="19" height="48" fill="url(#gold)"/>
    <rect x="33" y="10" width="19" height="48" fill="url(#fahl)"/>
    <!-- Luecken, wo schon etwas fehlt -->
    <rect x="43" y="19" width="5" height="5" fill="#1b2630"/>
    <rect x="46" y="31" width="5" height="5" fill="#1b2630"/>
    <rect x="39" y="41" width="4" height="4" fill="#1b2630"/>
  </g>
  <!-- und was davon wegtreibt -->
  <g fill="#bccddb">
    <rect x="54" y="13" width="4" height="4" opacity="0.6"/>
    <rect x="56" y="24" width="3" height="3" opacity="0.4"/>
    <rect x="53" y="35" width="3.5" height="3.5" opacity="0.5"/>
    <rect x="58" y="6" width="3" height="3" opacity="0.28"/>
  </g>
</svg>
